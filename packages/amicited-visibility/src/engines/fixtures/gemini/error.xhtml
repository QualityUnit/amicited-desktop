<model-response xmlns="http://www.w3.org/1999/xhtml" class="enable-lr26-response-chrome-updates"
  ><div>
    <response-container
      class="ng-tns-c2005330352-10 reduced-bottom-padding enable-lr26-response-chrome-updates enable-luminous-sources"
      ><div class="response-container response-container-with-gpi no-background">
        <div class="response-container-header">
          <div class="response-container-header-controls">
            <div class="ng-tns-c2005330352-10 tts">
              <div class="single-draft-response-container"></div>
            </div>
          </div>
          <div class="response-container-header-status">
            <div class="response-container-header-processing-state"></div>
          </div>
        </div>
        <div class="presented-response-container">
          <div class="response-container-content has-thoughts">
            <div highlighttoaskhost="" class="response-content">
              <thinking-overlay class="enable-luminous-fast-follows"></thinking-overlay>
              <div class="model-response-label-announcer" aria-busy="false" aria-live="polite">
                <h6 class="cdk-visually-hidden screen-reader-model-response-label">Gemini said</h6>
              </div>
              <model-response-content
                ><div collapsibleresponsecontent="" class="collapsible-content-wrapper">
                  <structured-content-container
                    class="model-response-text contains-extensions-response has-thoughts processing-state-visible"
                    ><div class="container">
                      <message-content class="ng-star-inserted"
                        ><div
                          inline-copy-host=""
                          class="markdown markdown-main-panel md-content enable-luminous-fast-follows enable-updated-hr-color"
                          aria-busy="false"
                          aria-live="polite"
                          dir="ltr"
                        >
                          <p dir="ltr" class="first-token">
                            <span>I encountered an error doing what you asked.</span
                            ><span> Could you try again?</span>
                          </p>
                        </div></message-content
                      >
                    </div></structured-content-container
                  >
                </div></model-response-content
              >
              <div class="response-footer contains-extensions-response gap has-thoughts complete">
                <sources-list class="sources-list"></sources-list
                ><election-info-disclaimer class="ng-star-inserted"></election-info-disclaimer
                ><finance-info-disclaimer class="ng-star-inserted"></finance-info-disclaimer>
              </div>
            </div>
            <sensitive-memories-banner class="ng-star-inserted"></sensitive-memories-banner>
          </div>
        </div>
        <div class="response-container-footer">
          <message-actions footer="" class="hide-on-print"
            ><div class="actions-container-v2">
              <div class="buttons-container-v2">
                <div class="ng-tns-c1187819615-11">
                  <regenerate-button class="ng-tns-c1187819615-11"
                    ><gem-icon-button
                      theme="lm"
                      type="onSurface"
                      clankmodalmenu=""
                      gemmenutrigger=""
                      cdkoverlayorigin=""
                      fonticonname="refresh"
                      gemtooltip="Redo"
                      arialabel="Redo"
                      class="mat-mdc-tooltip-trigger gem-button gem-button-badge-size-small gem-button-size-small gem-button-type-on-surface lm-enabled"
                      data-test-id="regenerate-button"
                      tabindex="-1"
                      aria-disabled="false"
                      aria-haspopup="true"
                      aria-expanded="false"
                      ><button
                        matbadgeposition="after"
                        maticonbutton=""
                        class="mdc-icon-button mat-mdc-icon-button mat-mdc-button-base mat-badge mat-unthemed mat-badge-overlap mat-badge-above mat-badge-after mat-badge-small mat-badge-hidden"
                        aria-label="Redo"
                        aria-disabled="false"
                      >
                        <span
                          class="mat-mdc-button-persistent-ripple mdc-icon-button__ripple"
                        ></span
                        ><gem-icon><mat-icon></mat-icon></gem-icon
                        ><span class="mat-focus-indicator"></span
                        ><span class="mat-mdc-button-touch-target"></span></button></gem-icon-button
                    ><gem-popover class="ng-star-inserted"></gem-popover
                    ><mat-menu xposition="after" yposition="below"></mat-menu
                  ></regenerate-button>
                </div>
                <copy-button class="ng-tns-c1187819615-11"
                  ><gem-icon-button
                    theme="lm"
                    type="onSurface"
                    arialabel="Copy"
                    gemtooltip="Copy response"
                    class="mat-mdc-tooltip-trigger gem-button gem-button-badge-size-small gem-button-size-small gem-button-type-on-surface lm-enabled"
                    ><button
                      matbadgeposition="after"
                      maticonbutton=""
                      class="mdc-icon-button mat-mdc-icon-button mat-mdc-button-base mat-badge mat-unthemed mat-badge-overlap mat-badge-above mat-badge-after mat-badge-small mat-badge-hidden"
                      aria-label="Copy"
                      aria-disabled="false"
                    >
                      <span class="mat-mdc-button-persistent-ripple mdc-icon-button__ripple"></span
                      ><gem-icon><mat-icon></mat-icon></gem-icon
                      ><span class="mat-focus-indicator"></span
                      ><span class="mat-mdc-button-touch-target"></span></button></gem-icon-button
                  ><mat-menu xposition="after" yposition="below"></mat-menu
                ></copy-button>
                <div cdkoverlayorigin="" class="ng-tns-c1187819615-11">
                  <div class="menu-button-wrapper">
                    <div class="more-menu-button-container">
                      <gem-icon-button
                        cdkoverlayorigin=""
                        gemmenutrigger=""
                        theme="lm"
                        type="onSurface"
                        arialabel="Show more options"
                        gemtooltip="More"
                        data-test-id="more-menu-button"
                        class="mat-mdc-tooltip-trigger gem-button gem-button-badge-size-small gem-button-size-small gem-button-type-on-surface lm-enabled"
                        tabindex="-1"
                        aria-disabled="false"
                        aria-haspopup="true"
                        aria-expanded="false"
                        ><button
                          matbadgeposition="after"
                          maticonbutton=""
                          class="mdc-icon-button mat-mdc-icon-button mat-mdc-button-base mat-badge mat-unthemed mat-badge-overlap mat-badge-above mat-badge-after mat-badge-small mat-badge-hidden"
                          aria-label="Show more options"
                          aria-disabled="false"
                        >
                          <span
                            class="mat-mdc-button-persistent-ripple mdc-icon-button__ripple"
                          ></span
                          ><gem-icon><mat-icon></mat-icon></gem-icon
                          ><span class="mat-focus-indicator"></span
                          ><span class="mat-mdc-button-touch-target"></span></button
                      ></gem-icon-button>
                    </div>
                  </div>
                </div>
                <div class="spacer"></div>
              </div>
            </div>
            <mat-menu xposition="after" yposition="above" class="ng-tns-c1187819615-11"></mat-menu
            ><gem-popover class="ng-tns-c1187819615-11"></gem-popover
            ><mat-menu yposition="above" class="ng-tns-c1187819615-11"></mat-menu
          ></message-actions>
        </div></div></response-container
    ><freemium-rag-disclaimer class="ng-star-inserted"></freemium-rag-disclaimer></div
></model-response>
